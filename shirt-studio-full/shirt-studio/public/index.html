<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Archivo+Black&family=Bebas+Neue&family=Caveat:wght@600&family=Pacifico&family=Playfair+Display:wght@700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<style>
:root{--bg:#EEEFF1;--panel:#fff;--line:#E2E4E8;--ink:#15171C;--mute:#6D727C;--hover:#F3F4F6;--danger:#B3261E;--r:10px}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.4 "Instrument Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

header{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--panel)}
.brand{font-weight:600;font-size:17px;letter-spacing:-.01em}
.actions{display:flex;align-items:center;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:var(--r);display:grid;place-items:center}
.icon-btn:hover:not(:disabled){background:var(--hover)}
.icon-btn:disabled{opacity:.3;cursor:default}
.btn{height:36px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);font-weight:500}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{opacity:.88}
.btn:disabled{opacity:.5;cursor:default}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.tabs{flex:none;display:flex;justify-content:center;gap:4px;padding:0 12px 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{height:34px;padding:0 14px;border-radius:999px;font-weight:500;color:var(--mute);white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{background:var(--hover);color:var(--ink)}
.tab[aria-pressed=true]{background:var(--ink);color:#fff}
.tab small{font-size:11px;font-weight:500;padding:1px 6px;border-radius:999px;border:1px solid currentColor;opacity:.8}

main{flex:1;min-height:0;display:grid;grid-template-columns:72px 1fr 264px}
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0}
.tool{width:56px;padding:8px 0 6px;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--mute)}
.tool:hover{background:var(--hover);color:var(--ink)}

.stage{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;overflow:hidden}
.stage.drag::after{content:"Drop image";position:absolute;inset:12px;border:1.5px dashed var(--ink);border-radius:16px;display:grid;place-items:center;background:rgba(238,239,241,.85);font-weight:500;z-index:5}
#fit{position:relative;width:500px;height:600px;transform-origin:center center;flex:none}
#mock{position:absolute;inset:0;width:500px;height:600px}
.canvas-container{position:absolute!important;inset:0}
#guide{position:absolute;border:1px dashed rgba(128,132,140,.8);pointer-events:none}
.opts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.opts .chip{padding:0 14px}
.opts .chip.two{height:44px;display:flex;flex-direction:column;justify-content:center;line-height:1.2}
.opts .chip small{font-size:12px;opacity:.7;font-weight:400}
.swatches{display:flex;gap:10px}
.sw{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.18);box-shadow:inset 0 0 0 2px var(--bg)}
.sw[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:2px}

aside{background:var(--panel);border-left:1px solid var(--line);padding:20px;overflow:auto}
.empty{color:var(--mute);font-size:14px}
.group{display:flex;flex-direction:column;gap:14px;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.group:last-child{border:0;margin:0;padding:0}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;color:var(--mute)}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
select,input[type=text],input[type=email],input[type=tel],input[type=number],textarea{width:100%;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
textarea{height:76px;padding:8px 10px;resize:none}
input[type=color]{width:100%;height:38px;padding:3px;border:1px solid var(--line);border-radius:var(--r);background:#fff;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--ink)}
.chip{height:36px;border:1px solid var(--line);border-radius:var(--r);font-size:14px;font-weight:500;background:#fff}
.chip:hover{background:var(--hover)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.danger{color:var(--danger)}

dialog{border:0;border-radius:16px;padding:0;width:min(420px,calc(100vw - 32px));max-height:calc(100vh - 32px);box-shadow:0 20px 60px rgba(0,0,0,.2)}
dialog::backdrop{background:rgba(21,23,28,.4)}
dialog form,.done{padding:24px;display:flex;flex-direction:column;gap:16px}
dialog h2{font-size:19px;font-weight:600;letter-spacing:-.01em}
.err{color:var(--danger);font-size:14px}
.preview{display:flex;gap:14px;align-items:center}
.thumb{width:64px;height:76px;flex:none;border-radius:8px;border:1px solid var(--line);background:var(--shirt,#fff);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain}
.summary{font-weight:500}.summary span{display:block;color:var(--mute);font-weight:400;font-size:14px}

.busy{position:fixed;inset:0;background:rgba(238,239,241,.8);display:none;place-items:center;z-index:20}
.busy.on{display:grid}
.busy div{background:#fff;border:1px solid var(--line);padding:18px 22px;border-radius:14px;width:260px;display:flex;flex-direction:column;gap:12px;font-weight:500}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:40%;background:var(--ink);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30}
.toast.on{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:860px){
  main{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  .tabs{justify-content:flex-start}
  .rail{flex-direction:row;justify-content:center;border-right:0;border-bottom:1px solid var(--line);padding:6px}
  aside{border-left:0;border-top:1px solid var(--line);max-height:34vh;padding:16px}
  header{padding:0 12px}
  .btn{padding:0 12px}
}
</style>
</head>
<body>
<header>
  <div class="brand">Studio</div>
  <div class="actions">
    <button class="icon-btn" id="undo" aria-label="Undo" disabled><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="icon-btn" id="redo" aria-label="Redo" disabled><svg class="i" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button class="btn" id="save">Save</button>
    <button class="btn primary" id="order">Order</button>
  </div>
</header>
<nav class="tabs" id="tabs" aria-label="Product"></nav>

<main>
  <nav class="rail" aria-label="Tools">
    <button class="tool" id="addImage"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-9 9"/></svg>Image</button>
    <button class="tool" id="addText"><svg class="i" viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>Text</button>
    <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
  </nav>

  <section class="stage" id="stage">
    <div id="fit">
      <svg id="mock" viewBox="0 0 500 600" aria-hidden="true"></svg>
      <canvas id="c" width="500" height="600"></canvas>
      <div id="guide"></div>
    </div>
    <div class="opts" id="opts" role="group" aria-label="Options"></div>
    <div class="swatches" id="swatches" role="group" aria-label="Colour"></div>
  </section>

  <aside id="panel">
    <p class="empty" id="p-empty">Add an image or some text to start. You can also drop images straight onto the product.</p>

    <div class="group" id="p-text" hidden>
      <label class="field"><span>Font</span><select id="font"></select></label>
      <div class="row">
        <label class="field"><span>Colour</span><input type="color" id="fill" value="#15171C"></label>
        <div class="field"><span>Weight</span><button class="chip" id="bold" aria-pressed="false">Bold</button></div>
      </div>
      <label class="field"><span>Size</span><input type="range" id="size" min="8" max="200" value="40"></label>
    </div>

    <div class="group" id="p-image" hidden>
      <button class="btn" id="removeBg">Remove background</button>
      <button class="btn" id="flip">Flip horizontally</button>
    </div>

    <div class="group" id="p-common" hidden>
      <label class="field"><span>Opacity</span><input type="range" id="opacity" min="5" max="100" value="100"></label>
      <div class="row"><button class="chip" id="center">Center</button><button class="chip" id="dup">Duplicate</button></div>
      <div class="row"><button class="chip" id="forward">Bring forward</button><button class="chip" id="backward">Send back</button></div>
      <button class="chip danger" id="del">Delete</button>
    </div>
  </aside>
</main>

<dialog id="orderDlg">
  <form id="orderForm" method="dialog">
    <h2>Place your order</h2>
    <div class="preview"><div class="thumb" id="thumb"><img alt="Your design"></div>
      <p class="summary" id="summary"></p></div>
    <label class="field"><span>Name</span><input type="text" name="name" required maxlength="80" autocomplete="name"></label>
    <label class="field"><span>Email</span><input type="email" name="email" required autocomplete="email"></label>
    <label class="field"><span>Phone (optional)</span><input type="tel" name="phone" maxlength="25" autocomplete="tel" inputmode="tel"></label>
    <label class="field"><span>Quantity</span><input type="number" name="qty" value="1" min="1" max="100"></label>
    <label class="field"><span>Notes (optional)</span><textarea name="notes" maxlength="500"></textarea></label>
    <p class="err" id="orderErr" role="alert"></p>
    <div class="row"><button type="button" class="btn" id="orderCancel">Cancel</button><button class="btn primary" id="orderSubmit">Place order</button></div>
  </form>
  <div class="done" id="orderDone" hidden>
    <h2>Order received</h2>
    <p>Your order number is <b id="orderNo"></b>. We'll contact you to confirm.</p>
    <button class="btn primary" id="orderClose">Done</button>
  </div>
</dialog>

<div class="busy" id="busy"><div><span id="busyText">Working…</span><span class="bar"><i></i></span></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
const COLORS = [['White','#F4F4F2'],['Black','#16181D'],['Grey','#9AA0A8'],['Navy','#22304F'],['Green','#3F5A47'],['Red','#B7352D']];
const FONTS = ['Instrument Sans','Archivo Black','Bebas Neue','Playfair Display','Caveat','Pacifico','Space Mono'];

/* ---------- products ---------- */
const inch = cm => String(Math.round(cm / 2.54 * 10) / 10);
const sizes = a => a.map(s => ({ id: s, label: s }));
const PRODUCTS = {
  shirt:  { label: 'Shirt',  options: sizes(['XS','S','M','L','XL','2XL']), def: 'M', pa: () => ({ x: 155, y: 168, w: 190, h: 230 }) },
  hoodie: { label: 'Hoodie', options: sizes(['M','L','XL','XXXL']), def: 'L', pa: () => ({ x: 180, y: 195, w: 140, h: 125 }) },
  hat:    { label: 'Hat',    options: [{ id: 'baseball', label: 'Baseball hat' }, { id: 'bucket', label: 'Bucket hat' }], def: 'baseball',
            pa: o => o === 'bucket' ? { x: 180, y: 170, w: 140, h: 115 } : { x: 185, y: 185, w: 130, h: 100 } },
  pillow: { label: 'Pillow', beta: true, options: [{ id: 'square', label: 'Square' }], def: 'square', pa: () => ({ x: 130, y: 180, w: 240, h: 240 }) },
  blanket:{ label: 'Blanket', def: '75x100',
            options: [[75,100],[100,150],[130,150]].map(([w,h]) => ({ id: `${w}x${h}`, label: `${w} × ${h} cm`, sub: `${inch(w)} × ${inch(h)} in`, w, h })),
            pa(o) { const b = this.options.find(x => x.id === o) || this.options[0], k = Math.min(380 / b.w, 460 / b.h), w = b.w * k, h = b.h * k;
                    return { x: 250 - w / 2, y: 300 - h / 2, w, h }; } }
};
const state = { product: 'shirt', variant: Object.fromEntries(Object.entries(PRODUCTS).map(([k, p]) => [k, p.def])),
  colorName: COLORS[0][0], colorHex: COLORS[0][1], designId: null, printUrl: null, dirty: false };
const mem = {};                                   // per-product work in progress
const P = () => PRODUCTS[state.product];
const opt = () => P().options.find(o => o.id === state.variant[state.product]);
let PA = P().pa(state.variant.shirt);

function mockup() {
  const c = state.colorHex, ln = 'rgba(0,0,0,.14)', sh = 'rgba(0,0,0,.13)', v = state.variant[state.product];
  switch (state.product) {
    case 'shirt': return `<g transform="translate(0,28)"><path fill="${c}" stroke="${ln}" stroke-width="1.5" stroke-linejoin="round" d="M170 60 L120 80 L40 150 L85 205 L125 180 L125 470 Q125 485 140 485 L360 485 Q375 485 375 470 L375 180 L415 205 L460 150 L380 80 L330 60 Q300 95 250 95 Q200 95 170 60Z"/><path d="M170 60 Q200 95 250 95 Q300 95 330 60 Q300 122 250 122 Q200 122 170 60Z" fill="${sh}"/></g>`;
    case 'hoodie': return `<g stroke="${ln}" stroke-width="1.5" stroke-linejoin="round">
      <path fill="${c}" d="M125 110 L55 165 L35 430 L90 442 L125 305Z"/><path fill="${c}" d="M375 110 L445 165 L465 430 L410 442 L375 305Z"/>
      <path fill="${c}" d="M165 100 L125 110 L125 485 L375 485 L375 110 L335 100 Q250 150 165 100Z"/>
      <path fill="${c}" d="M168 100 Q172 38 250 34 Q328 38 332 100 Q250 152 168 100Z"/>
      <path fill="rgba(0,0,0,.28)" stroke="none" d="M196 98 Q250 138 304 98 Q300 62 250 58 Q200 62 196 98Z"/>
      <path fill="${c}" d="M168 372 L332 372 L352 440 L148 440Z"/>
      <path fill="none" d="M230 140 L229 188 M270 140 L271 188"/></g>`;
    case 'hat': return v === 'bucket'
      ? `<g stroke="${ln}" stroke-width="1.5" stroke-linejoin="round"><path fill="${c}" d="M155 130 C170 112 330 112 345 130 L378 318 L122 318Z"/><path fill="${c}" d="M45 335 C120 290 380 290 455 335 C482 365 430 412 250 417 C70 412 18 365 45 335Z"/><path fill="${sh}" stroke="none" d="M45 335 C120 290 380 290 455 335 C482 365 430 412 250 417 C70 412 18 365 45 335Z"/><path fill="none" d="M122 318 C190 335 310 335 378 318"/></g>`
      : `<g stroke="${ln}" stroke-width="1.5" stroke-linejoin="round"><path fill="${c}" d="M105 322 C105 170 180 125 250 125 C320 125 395 170 395 322Z"/><path fill="none" d="M250 125 L250 318"/><circle cx="250" cy="127" r="6" fill="${sh}"/><path fill="${c}" d="M88 320 C170 300 330 300 412 320 C444 348 420 398 250 403 C80 398 56 348 88 320Z"/><path fill="${sh}" stroke="none" d="M88 320 C170 300 330 300 412 320 C444 348 420 398 250 403 C80 398 56 348 88 320Z"/></g>`;
    case 'pillow': return `<defs><radialGradient id="pg" cx="50%" cy="45%" r="65%"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity=".07"/></radialGradient></defs><path fill="${c}" stroke="${ln}" stroke-width="1.5" d="M88 112 Q250 82 412 112 Q430 300 412 488 Q250 518 88 488 Q70 300 88 112Z"/><path fill="url(#pg)" d="M88 112 Q250 82 412 112 Q430 300 412 488 Q250 518 88 488 Q70 300 88 112Z"/>`;
    case 'blanket': return `<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".1"/></linearGradient></defs><rect x="${PA.x}" y="${PA.y}" width="${PA.w}" height="${PA.h}" rx="6" fill="${c}" stroke="${ln}" stroke-width="1.5"/><rect x="${PA.x}" y="${PA.y}" width="${PA.w}" height="${PA.h}" rx="6" fill="url(#bg)"/><rect x="${PA.x + 7}" y="${PA.y + 7}" width="${PA.w - 14}" height="${PA.h - 14}" rx="3" fill="none" stroke="rgba(0,0,0,.12)" stroke-dasharray="3 4"/>`;
  }
}

/* ---------- canvas ---------- */
const canvas = new fabric.Canvas('c', { width: 500, height: 600, preserveObjectStacking: true, controlsAboveOverlay: true });
const setClip = () => { canvas.clipPath = new fabric.Rect({ left: PA.x, top: PA.y, width: PA.w, height: PA.h, absolutePositioned: true }); };
fabric.Object.prototype.set({ transparentCorners: false, cornerColor: '#fff', cornerStrokeColor: '#15171C', borderColor: '#15171C', cornerStyle: 'circle', cornerSize: 11, borderScaleFactor: 1.4, padding: 2 });

function fit() {
  const st = $('stage'), extra = $('opts').offsetHeight + $('swatches').offsetHeight + 28 + 32;
  const s = Math.min(1, Math.max(.35, (st.clientHeight - extra) / 600), (st.clientWidth - 32) / 500);
  $('fit').style.transform = `scale(${s})`;
  $('fit').style.margin = `${-(600 * (1 - s)) / 2}px ${-(500 * (1 - s)) / 2}px`;
}
addEventListener('resize', fit);

function renderOpts() {
  const box = $('opts'); box.replaceChildren(); box.hidden = P().options.length < 2;
  P().options.forEach(o => {
    const b = document.createElement('button'); b.className = 'chip' + (o.sub ? ' two' : ''); b.setAttribute('aria-pressed', o.id === state.variant[state.product]);
    b.innerHTML = o.sub ? `${o.label}<small>${o.sub}</small>` : o.label;
    b.onclick = () => { state.variant[state.product] = o.id; state.dirty = true; render(); };
    box.append(b);
  });
}
function render() {
  PA = P().pa(state.variant[state.product]);
  $('mock').innerHTML = mockup();
  Object.assign($('guide').style, { left: PA.x + 'px', top: PA.y + 'px', width: PA.w + 'px', height: PA.h + 'px' });
  setClip(); renderOpts();
  document.querySelectorAll('.sw').forEach(b => b.setAttribute('aria-pressed', b.dataset.c === state.colorHex));
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-pressed', b.dataset.p === state.product));
  canvas.requestRenderAll(); fit();
}

/* ---------- history ---------- */
const hist = { stack: [], i: -1, lock: false };
const snapshot = () => { const j = canvas.toJSON(); delete j.clipPath; return JSON.stringify(j); };
function push() {
  if (hist.lock) return;
  hist.stack = hist.stack.slice(0, hist.i + 1); hist.stack.push(snapshot()); hist.i = hist.stack.length - 1;
  if (hist.stack.length > 60) { hist.stack.shift(); hist.i--; }
  state.dirty = true; syncHist();
}
function syncHist() { $('undo').disabled = hist.i <= 0; $('redo').disabled = hist.i >= hist.stack.length - 1; }
function restore(i) {
  hist.lock = true; hist.i = i;
  canvas.loadFromJSON(hist.stack[i], () => { setClip(); canvas.renderAll(); hist.lock = false; state.dirty = true; syncHist(); syncPanel(); });
}
$('undo').onclick = () => hist.i > 0 && restore(hist.i - 1);
$('redo').onclick = () => hist.i < hist.stack.length - 1 && restore(hist.i + 1);
['object:added','object:removed','object:modified'].forEach(e => canvas.on(e, push));
addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || canvas.getActiveObject()?.isEditing;
  if (typing) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? $('redo').click() : $('undo').click(); }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removeActive(); }
});

/* ---------- tabs, colours ---------- */
Object.entries(PRODUCTS).forEach(([id, p]) => {
  const b = document.createElement('button'); b.className = 'tab'; b.dataset.p = id;
  b.innerHTML = p.label + (p.beta ? ' <small>Beta</small>' : ''); b.onclick = () => switchProduct(id); $('tabs').append(b);
});
COLORS.forEach(([n, c]) => {
  const b = document.createElement('button'); b.className = 'sw'; b.style.background = c; b.dataset.c = c;
  b.setAttribute('aria-label', n); b.onclick = () => { state.colorName = n; state.colorHex = c; state.dirty = true; render(); };
  $('swatches').append(b);
});
const isDark = c => { const n = parseInt(c.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) < 140; };

function switchProduct(p) {
  if (p === state.product) return;
  canvas.discardActiveObject(); mem[state.product] = snapshot();
  state.product = p; state.designId = null; state.printUrl = null; history.replaceState(null, '', location.pathname);
  hist.lock = true;
  canvas.loadFromJSON(mem[p] || { objects: [] }, () => {
    render(); canvas.renderAll(); hist.lock = false;
    hist.stack = [snapshot()]; hist.i = 0; state.dirty = false; syncHist(); syncPanel();
  });
}

/* ---------- busy / toast ---------- */
const busy = (on, t) => { $('busy').classList.toggle('on', on); if (t) $('busyText').textContent = t; };
let toastT; function toast(t) { $('toast').textContent = t; $('toast').classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => $('toast').classList.remove('on'), 2600); }

/* ---------- images ---------- */
async function uploadBlob(blob) {
  const r = await fetch('/api/upload', { method: 'POST', headers: { 'Content-Type': blob.type }, body: blob });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || 'Upload failed'); return j.url;
}
async function prepare(file) {
  if (!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) throw new Error('Use a PNG, JPG, WebP or GIF image.');
  const bmp = await createImageBitmap(file), max = 3000;
  if (Math.max(bmp.width, bmp.height) <= max && file.size < 12e6) return file;
  const k = max / Math.max(bmp.width, bmp.height), c = document.createElement('canvas');
  c.width = Math.round(bmp.width * Math.min(k, 1)); c.height = Math.round(bmp.height * Math.min(k, 1));
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, 'image/webp', .92));
}
function addImageFromUrl(url) {
  return new Promise(res => fabric.Image.fromURL(url, img => {
    const k = Math.min((PA.w * .9) / img.width, (PA.h * .9) / img.height, 1);
    img.set({ left: PA.x + PA.w / 2, top: PA.y + PA.h / 2, originX: 'center', originY: 'center', scaleX: k, scaleY: k });
    canvas.add(img).setActiveObject(img); canvas.requestRenderAll(); res(img);
  }, { crossOrigin: 'anonymous' }));
}
async function addFiles(files) {
  const list = [...files].filter(f => f.type.startsWith('image/'));
  if (!list.length) return;
  busy(true, 'Adding image…');
  try { for (const f of list) await addImageFromUrl(await uploadBlob(await prepare(f))); }
  catch (e) { toast(e.message); } finally { busy(false); }
}
$('addImage').onclick = () => $('file').click();
$('file').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
const stage = $('stage');
['dragenter','dragover'].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); stage.classList.add('drag'); }));
['dragleave','drop'].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); if (ev === 'drop' || e.target === stage) stage.classList.remove('drag'); }));
stage.addEventListener('drop', e => addFiles(e.dataTransfer.files));
addEventListener('paste', e => { const f = [...(e.clipboardData?.files || [])]; if (f.length) addFiles(f); });

/* ---------- background removal (in the browser) ---------- */
let bgLib;
$('removeBg').onclick = async () => {
  const o = canvas.getActiveObject(); if (!o || o.type !== 'image') return;
  busy(true, 'Removing background…');
  try {
    bgLib ||= await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm');
    const src = await (await fetch(o.getSrc())).blob();
    const out = await bgLib.removeBackground(src, { output: { format: 'image/png' },
      progress: k => { $('busyText').textContent = k.startsWith('fetch') ? 'Downloading model (first time only)…' : 'Removing background…'; } });
    const url = await uploadBlob(out.type === 'image/png' ? out : new Blob([out], { type: 'image/png' }));
    await new Promise(r => o.setSrc(url, r, { crossOrigin: 'anonymous' }));
    canvas.fire('object:modified', { target: o }); canvas.requestRenderAll(); toast('Background removed');
  } catch (e) { console.error(e); toast('Could not remove the background. Try another image.'); }
  finally { busy(false); }
};
$('flip').onclick = () => { const o = canvas.getActiveObject(); if (o) { o.set('flipX', !o.flipX); canvas.requestRenderAll(); canvas.fire('object:modified', { target: o }); } };

/* ---------- text ---------- */
FONTS.forEach(f => { const o = document.createElement('option'); o.value = o.textContent = f; o.style.fontFamily = f; $('font').append(o); });
$('addText').onclick = async () => {
  const fill = isDark(state.colorHex) ? '#FFFFFF' : '#15171C';
  await document.fonts.load('40px "Instrument Sans"');
  const t = new fabric.IText('Your text', { left: PA.x + PA.w / 2, top: PA.y + PA.h / 2, originX: 'center', originY: 'center',
    fontFamily: 'Instrument Sans', fontSize: Math.max(16, Math.round(PA.w / 6.5)), fontWeight: 600, fill, textAlign: 'center' });
  canvas.add(t).setActiveObject(t); t.enterEditing(); t.selectAll(); canvas.requestRenderAll();
};
$('font').onchange = async e => { const o = canvas.getActiveObject(); if (!o) return;
  await document.fonts.load(`40px "${e.target.value}"`); o.set('fontFamily', e.target.value); o.initDimensions?.(); canvas.requestRenderAll(); canvas.fire('object:modified', { target: o }); };
$('fill').oninput = e => { const o = canvas.getActiveObject(); if (o) { o.set('fill', e.target.value); canvas.requestRenderAll(); } };
$('fill').onchange = () => canvas.fire('object:modified', { target: canvas.getActiveObject() });
$('bold').onclick = () => { const o = canvas.getActiveObject(); if (!o) return; o.set('fontWeight', o.fontWeight >= 600 || o.fontWeight === 'bold' ? 400 : 700); canvas.requestRenderAll(); canvas.fire('object:modified', { target: o }); syncPanel(); };
$('size').oninput = e => { const o = canvas.getActiveObject(); if (o) { o.set({ fontSize: +e.target.value, scaleX: 1, scaleY: 1 }); canvas.requestRenderAll(); } };
$('size').onchange = () => canvas.fire('object:modified', { target: canvas.getActiveObject() });

/* ---------- common tools ---------- */
function removeActive() { canvas.getActiveObjects().forEach(o => canvas.remove(o)); canvas.discardActiveObject().requestRenderAll(); }
$('del').onclick = removeActive;
$('center').onclick = () => { const o = canvas.getActiveObject(); if (!o) return; o.setPositionByOrigin(new fabric.Point(PA.x + PA.w / 2, PA.y + PA.h / 2), 'center', 'center'); o.setCoords(); canvas.requestRenderAll(); canvas.fire('object:modified', { target: o }); };
$('dup').onclick = () => { const o = canvas.getActiveObject(); if (!o) return;
  o.clone(c => { c.set({ left: o.left + 14, top: o.top + 14 }); canvas.add(c).setActiveObject(c); canvas.requestRenderAll(); }); };
$('forward').onclick = () => { const o = canvas.getActiveObject(); if (o) { canvas.bringForward(o); canvas.fire('object:modified', { target: o }); } };
$('backward').onclick = () => { const o = canvas.getActiveObject(); if (o) { canvas.sendBackwards(o); canvas.fire('object:modified', { target: o }); } };
$('opacity').oninput = e => { const o = canvas.getActiveObject(); if (o) { o.set('opacity', e.target.value / 100); canvas.requestRenderAll(); } };
$('opacity').onchange = () => canvas.fire('object:modified', { target: canvas.getActiveObject() });

function syncPanel() {
  const o = canvas.getActiveObject(), has = !!o;
  $('p-empty').hidden = has; $('p-common').hidden = !has;
  $('p-text').hidden = !(has && o.type === 'i-text'); $('p-image').hidden = !(has && o.type === 'image');
  if (!has) return;
  $('opacity').value = Math.round((o.opacity ?? 1) * 100);
  if (o.type === 'i-text') {
    $('font').value = o.fontFamily; $('fill').value = /^#[0-9a-f]{6}$/i.test(o.fill) ? o.fill : '#15171C';
    $('size').value = Math.round(o.fontSize * (o.scaleX || 1));
    $('bold').setAttribute('aria-pressed', o.fontWeight >= 600 || o.fontWeight === 'bold');
  }
}
['selection:created','selection:updated','selection:cleared'].forEach(e => canvas.on(e, syncPanel));

/* ---------- save ---------- */
async function exportPrint() {
  canvas.discardActiveObject().renderAll();
  const mult = Math.min(10, 2400 / Math.max(PA.w, PA.h));
  const url = canvas.toDataURL({ format: 'png', left: PA.x, top: PA.y, width: PA.w, height: PA.h, multiplier: mult });
  return await (await fetch(url)).blob();
}
async function save() {
  if (!canvas.getObjects().length) { toast('Add an image or text first'); return null; }
  if (state.designId && !state.dirty) return state.designId;
  busy(true, 'Saving design…');
  try {
    const printUrl = await uploadBlob(await exportPrint());
    const r = await fetch('/api/designs', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: P().label + ' design', state: JSON.parse(snapshot()), printUrl, shirtColor: state.colorHex, colorName: state.colorName,
        product: state.product, variant: state.variant[state.product] }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.error);
    state.designId = j.id; state.dirty = false; state.printUrl = printUrl;
    history.replaceState(null, '', `?d=${j.id}`);
    return j.id;
  } catch (e) { toast(e.message || 'Could not save. Try again.'); return null; }
  finally { busy(false); }
}
$('save').onclick = async () => {
  const id = await save(); if (!id) return;
  const link = location.origin + location.pathname + '?d=' + id;
  try { await navigator.clipboard.writeText(link); toast('Saved. Link copied'); } catch { toast('Saved. Link is in the address bar'); }
};

/* ---------- order ---------- */
const dlg = $('orderDlg');
$('order').onclick = async () => {
  const id = await save(); if (!id) return;
  const o = opt();
  $('summary').innerHTML = ''; $('summary').append(P().label + ' · ' + o.label + (o.sub ? ` (${o.sub})` : ''), Object.assign(document.createElement('span'), { textContent: state.colorName }));
  $('thumb').style.setProperty('--shirt', state.colorHex); $('thumb').querySelector('img').src = state.printUrl;
  $('orderForm').hidden = false; $('orderDone').hidden = true; $('orderErr').textContent = ''; dlg.showModal();
};
$('orderCancel').onclick = () => dlg.close();
$('orderClose').onclick = () => dlg.close();
$('orderForm').onsubmit = async e => {
  e.preventDefault(); const f = new FormData(e.target); $('orderSubmit').disabled = true; $('orderErr').textContent = '';
  try {
    const r = await fetch('/api/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ designId: state.designId, name: f.get('name'), email: f.get('email'), phone: f.get('phone'), qty: f.get('qty'), notes: f.get('notes') }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.error);
    $('orderNo').textContent = j.id; $('orderForm').hidden = true; $('orderDone').hidden = false; e.target.reset();
  } catch (err) { $('orderErr').textContent = err.message || 'Could not place the order.'; }
  finally { $('orderSubmit').disabled = false; }
};

/* ---------- boot ---------- */
(async function boot() {
  FONTS.forEach(f => document.fonts.load(`20px "${f}"`));
  render();
  const id = new URLSearchParams(location.search).get('d');
  if (id) {
    try {
      const r = await fetch('/api/designs/' + id); const d = await r.json(); if (!r.ok) throw 0;
      await document.fonts.ready;
      if (!PRODUCTS[d.product]) throw 0;
      state.product = d.product; state.variant[d.product] = d.variant;
      const c = COLORS.find(c => c[1] === d.shirtColor); if (c) { state.colorName = c[0]; state.colorHex = c[1]; }
      render(); hist.lock = true;
      canvas.loadFromJSON(d.state, () => { setClip(); canvas.renderAll(); hist.lock = false; state.designId = id; state.printUrl = d.printUrl; state.dirty = false; hist.stack = [snapshot()]; hist.i = 0; syncHist(); });
      return;
    } catch { toast('That design could not be found'); history.replaceState(null, '', location.pathname); }
  }
  hist.stack = [snapshot()]; hist.i = 0; state.dirty = false; syncHist();
})();
</script>
</body>
